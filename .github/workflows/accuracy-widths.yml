name: Accuracy at every width 1-100
on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/global/accuracy_widths.py'
      - 'benchmarks/global/path_compare.py'
      - '.github/workflows/accuracy-widths.yml'
      - 'apps/web/public/dsiq/engine.mjs'
      - 'benchmarks/global/accuracy_browser_widths.mjs'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      NUMBA_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - run: node benchmarks/global/accuracy_browser_widths.mjs > browser.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5' 'mpmath==1.3.0' 'quimb==1.11.0'
      - run: python benchmarks/global/accuracy_widths.py --quimb --output accuracy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: accuracy-widths
          path: |
            accuracy.json
            browser.json
