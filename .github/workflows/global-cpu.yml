name: Global CPU benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/global/**'
      - '.github/workflows/global-cpu.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install qiskit==2.2.3 qiskit-aer==0.17.2 numpy==2.2.6
      - run: python benchmarks/global/run.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-cpu-results
          path: global-results.json
