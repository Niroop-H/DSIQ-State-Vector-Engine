name: DSIQ regression and scientific gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Linux audit runtime
        run: sudo apt-get update && sudo apt-get install -y libseccomp2
      - name: Install test-only numerical reference dependencies
        run: python -m pip install -r tests/reference-requirements.txt
      - name: Regression
        run: |
          node tests/dsiq.test.mjs
          node tests/coherent.test.mjs
          node tests/phase-product.test.mjs
          node tests/observable.test.mjs
          node tests/worker.test.mjs
          node tests/affine.test.mjs
          node tests/affine-phase.test.mjs
          node tests/factor.test.mjs
          node tests/native.test.mjs
          node tests/batch.test.mjs
          node tests/ladder.test.mjs
          node tests/parallel.test.mjs
          node tests/frame-factor.test.mjs
          node tests/rank-frame.test.mjs
          node tests/rank-ancilla.test.mjs
      - name: Native MPS and sliced contractor validation
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -B tests/mps-audit.py
          python -B tests/mps-deep-audit.py
          python -B tests/mps-random-uncompute.py
          python -B tests/sliced-bond-audit.py
  diamond:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Linux audit runtime
        run: sudo apt-get update && sudo apt-get install -y libseccomp2
      - name: Install test-only numerical reference dependencies
        run: python -m pip install -r tests/reference-requirements.txt
      - name: Build pinned QuEST CPU reference
        run: |
          git clone --depth 1 --branch v3.7.0 https://github.com/QuEST-Kit/QuEST "$RUNNER_TEMP/quest-src"
          test "$(git -C "$RUNNER_TEMP/quest-src" rev-parse HEAD)" = d4f75f724993b4af8e43a796e3c09ce24ae11670
          cmake -S "$RUNNER_TEMP/quest-src" -B "$RUNNER_TEMP/quest-build" -DCMAKE_BUILD_TYPE=Release -DPRECISION=2 -DDISTRIBUTED=OFF -DMULTITHREADED=OFF -DGPUACCELERATED=OFF -DUSER_SOURCE="$PWD/tests/quest-vector.c"
          cmake --build "$RUNNER_TEMP/quest-build" --parallel 2
          echo "DSIQ_QUEST_VECTOR=$RUNNER_TEMP/quest-build/demo" >> "$GITHUB_ENV"
      - name: Verify uncompute diagnostics
        run: OPENBLAS_NUM_THREADS=1 python -B tests/echo-projection.py
      - name: Execute unchanged scientific release gate
        id: gate
        continue-on-error: true
        run: DSIQ_AUDIT_SEED=2738912009 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 node --max-old-space-size=3072 tests/diamond.test.mjs diamond-current.json
      - name: Compare every test against committed historical baseline
        if: always() && steps.gate.outcome != 'skipped'
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: python scripts/check_diamond_regression.py diamond-results.json diamond-current.json
      - name: Preserve scientific evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diamond-105-evidence
          path: diamond-current.json
          if-no-files-found: error
