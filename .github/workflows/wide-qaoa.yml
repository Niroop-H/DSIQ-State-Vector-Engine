name: Wide QAOA path comparison
on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/global/wide_qaoa.py'
      - 'benchmarks/global/path_compare.py'
      - '.github/workflows/wide-qaoa.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        width: [50, 75, 100]
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMBA_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5' 'quimb==1.11.0'
      - run: python benchmarks/global/path_compare.py ${{ matrix.width }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: path-${{ matrix.width }}
          path: result.json
