name: Specialist simulator comparison
on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/specialists/**'
      - 'native/cpu_statevector.cpp'
      - 'apps/web/public/dsiq/complement.mjs'
      - '.github/workflows/specialists.yml'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  RAYON_NUM_THREADS: '1'
jobs:
  dense:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        family: [qaoa, qaoa-fresh, qft, qft-input, grover, ghz]
        n: [12, 16, 20]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'mqt.bench==2.3.0' 'qiskit-aer==0.17.2' 'qsimcirq==0.22.1' 'qulacs==0.6.12' 'pennylane==0.43.1' 'pennylane-lightning==0.43.0' 'mqt.ddsim==2.7.0' 'gast==0.6.0'
      - name: Build DSIQ native CPU statevector
        run: |
          g++ -std=c++20 -O3 -march=native -Wall -Wextra -Werror native/cpu_statevector.cpp -o "$RUNNER_TEMP/dsiq-native"
          echo "DSIQ_NATIVE_BIN=$RUNNER_TEMP/dsiq-native" >> "$GITHUB_ENV"
      - run: python tests/native_cpu_differential.py "$DSIQ_NATIVE_BIN"
      - name: Build double-precision QuEST
        run: |
          git clone -q --depth 1 -b v3.7.0 https://github.com/QuEST-Kit/QuEST "$RUNNER_TEMP/quest"
          test "$(git -C "$RUNNER_TEMP/quest" rev-parse HEAD)" = d4f75f724993b4af8e43a796e3c09ce24ae11670
          cmake -S "$RUNNER_TEMP/quest" -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE=Release -DPRECISION=2 -DDISTRIBUTED=OFF -DMULTITHREADED=OFF -DGPUACCELERATED=OFF -DUSER_SOURCE="$PWD/benchmarks/specialists/quest.c"
          cmake --build "$RUNNER_TEMP/build" --parallel 2
          echo "QUEST_BIN=$RUNNER_TEMP/build/demo" >> "$GITHUB_ENV"
      - run: python benchmarks/specialists/dense.py ${{ matrix.family }} ${{ matrix.n }} --extended
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.family }}-${{ matrix.n }}
          path: result.json
      - run: python -c "import json; d=json.load(open('result.json')); assert all(v.get('passed') for v in d['engines'].values())"
  sector:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {n: 100, seed: 4183}
          - {n: 100, seed: 12171}
          - {n: 100, seed: 73619}
          - {n: 50, seed: 945173}
          - {n: 75, seed: 945198}
          - {n: 100, seed: 945223}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'quspin==1.0.0'
      - run: python benchmarks/specialists/sector.py ${{ matrix.n }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sector-${{ matrix.seed }}
          path: result.json
      - run: python -c "import json; d=json.load(open('result.json')); assert all(v.get('passed') for v in d['engines'].values())"
