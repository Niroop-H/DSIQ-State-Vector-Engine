name: Diamond-70 diagnostic sweep
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/diamond70-budget-sweep.py'
      - '.github/workflows/diamond70-diagnostics.yml'
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tests/diamond70-budget-sweep.py
      - name: Collect provenance
        if: always()
        run: |
          mkdir -p diagnostics
          cp diamond70-sweep.json diagnostics/ || true
          printf '%s\n' "$GITHUB_SHA" > diagnostics/commit.txt
          lscpu > diagnostics/cpu.txt
          python -m pip freeze > diagnostics/environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: diamond70-budget-sweep
          path: diagnostics/
