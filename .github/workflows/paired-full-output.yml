name: Paired full-output benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/global/paired_full_output.py'
      - '.github/workflows/paired-full-output.yml'
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install qiskit==2.2.3 qiskit-aer==0.17.2 numpy==2.3.5
      - run: python benchmarks/global/paired_full_output.py
      - name: Preserve provenance and results
        if: always()
        run: |
          mkdir -p paired-evidence
          cp paired-full-output.json paired-evidence/ || true
          printf '%s\n' "$GITHUB_SHA" > paired-evidence/commit.txt
          lscpu > paired-evidence/cpu.txt
          python -m pip freeze > paired-evidence/environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: paired-full-output
          path: paired-evidence/
